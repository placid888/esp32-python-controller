[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 保留前次已驗證的 TinyUSB 與 FS 建置修正。
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=1
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    ; 使用建置旗標設定螢幕，不修改 TFT_eSPI 的 User_Setup.h。
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=8
    -D TFT_RST=9
    -D TFT_BL=7
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    ; TFT_eSPI 2.5.43 與 Arduino-ESP32 3.x 的 S3 匯流排相容性修正。
    -D USE_HSPI_PORT=1
    ; 本機 Arduino-ESP32 3.3.12 / PlatformIO 的內建 Network 標頭搜尋修正。
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
lib_ldf_mode = deep+
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.0

